<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - CUR May Hamilton</title>

  <!-- Librerías JS garantizadas via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; color: #334155; }
    header { background: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; gap: 10px; background: #e2e8f0; padding: 10px 25px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: 600; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: white; }
    .container { max-width: 900px; margin: 25px auto; padding: 0 20px; }
    .tab-content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }
    input, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    button.btn-primary { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; }

    /* ESTILOS DE LA VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-box h3 { margin-bottom: 5px; color: #0f172a; }
    .modal-box p { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; font-weight: bold; }
    #qrcodeContainer { display: flex; justify-content: center; margin: 15px 0; }
    .btn-close {
      background: #64748b; color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
    }
    .btn-close:hover { background: #475569; }
  </style>
</head>
<body>

<header>
  <h3>Control Institucional - May Hamilton</h3>
  <div>
    <span id="userDisplay" style="margin-right: 15px; font-size: 0.9rem;"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>

<div class="nav-tabs">
  <button id="btnTabGen" class="tab-btn active" onclick="cambiarTab('generador')">🪪 Generador de QR</button>
  <button id="btnTabCon" class="tab-btn" onclick="cambiarTab('consulta')">🔍 Consulta de Personal</button>
</div>

<div class="container">

  <!-- MÓDULO 1: GENERADOR DE QR -->
  <div id="generador" class="tab-content active">
    <h2>Generador de QR Cifrado</h2>
    <hr style="margin: 15px 0;">
    <div class="form-group">
      <label for="cedula">Cédula / ID de Empleado:</label>
      <input type="text" id="cedula" placeholder="Ej: V-12345678" style="width:100%;">
    </div>
    <div class="form-group">
      <label for="secretKey">Clave Secreta Institucional (Opcional):</label>
      <input type="password" id="secretKey" placeholder="Ingresa la clave maestra" style="width:100%;">
    </div>
    <button class="btn-primary" onclick="generarQREmergente()">Generar Código QR</button>
  </div>

  <!-- MÓDULO 2: CONSULTA DE PERSONAL -->
  <div id="consulta" class="tab-content">
    <h2>Consulta de Personal Registrado</h2>
    <hr style="margin: 15px 0;">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="buscarInput" placeholder="Buscar por Nombre, Cédula o Cargo..." onkeyup="filtrarTabla()" style="flex:1;">
    </div>
    <button onclick="cargarPersonal()" style="background:#059669; color:white; border:none; cursor:pointer; font-weight:bold; margin-bottom: 15px; padding: 10px 15px; border-radius:6px;">🔄 Cargar / Actualizar Lista</button>

    <table id="tablaPersonal">
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre Completo</th>
          <th>Departamento</th>
          <th>Cargo</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" style="text-align:center;">Presione "Cargar / Actualizar Lista" para obtener la información.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- VENTANA EMERGENTE (MODAL QR) -->
<div id="qrModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Código QR Generado</h3>
    <p id="modalCedulaText">Cédula: -</p>
    
    <div id="qrcodeContainer"></div>

    <button class="btn-close" onclick="cerrarModal()">Cerrar Ventana</button>
  </div>
</div>

<script>
  const API_KEY = "MiClaveSuperSegura2026";
  const SECRET_KEY_DEF = "MiClaveSegura2026";
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

  // Verificar sesión al cargar
  window.onload = function() {
    if (!sessionStorage.getItem("session_token")) {
      window.location.href = "login.html";
    } else {
      const user = sessionStorage.getItem("session_user") || "Usuario";
      document.getElementById("userDisplay").innerText = "👤 " + user;
    }
  };

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

  function cambiarTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (tabId === 'generador') document.getElementById('btnTabGen').classList.add('active');
    if (tabId === 'consulta') document.getElementById('btnTabCon').classList.add('active');
  }

  // FUNCIÓN PRINCIPAL PARA GENERAR QR EN MODAL
  function generarQREmergente() {
    const cedulaInput = document.getElementById("cedula");
    const keyInput = document.getElementById("secretKey");
    const qrContainer = document.getElementById("qrcodeContainer");

    if (!cedulaInput || !cedulaInput.value.trim()) {
      alert("Por favor ingrese la cédula o ID del empleado.");
      return;
    }

    const cedula = cedulaInput.value.trim();
    const key = keyInput && keyInput.value.trim() ? keyInput.value.trim() : SECRET_KEY_DEF;

    // Verificar si la librería QRCode existe
    if (typeof QRCode === "undefined") {
      alert("Error: La librería de generación QR no cargó correctamente.");
      return;
    }

    // Limpiar contenedor previo
    qrContainer.innerHTML = "";

    try {
      // 1. Cifrar los datos
      const payload = JSON.stringify({ id: cedula, origen: "CUR_MAY_HAMILTON" });
      const cifrado = CryptoJS.AES.encrypt(payload, key).toString();

      // 2. Renderizar QR
      new QRCode(qrContainer, {
        text: cifrado,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      // 3. Mostrar Modal
      document.getElementById("modalCedulaText").innerText = "Cédula: " + cedula;
      document.getElementById("qrModal").style.display = "flex";

      // 4. Bitácora
      registrarBitacoraQR(cedula);

    } catch (err) {
      alert("Error al procesar el código QR: " + err.message);
    }
  }

  function cerrarModal() {
    document.getElementById("qrModal").style.display = "none";
  }

  function registrarBitacoraQR(cedulaGenerada) {
    const usuarioActual = sessionStorage.getItem("session_user") || "Desconocido";

    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "registrarGeneracionQR",
        usuario: usuarioActual,
        rol: "Administrador",
        cedulaGenerada: cedulaGenerada
      })
    }).catch(e => console.log("Bitácora:", e));
  }

  // CONSULTA DE PERSONAL
  let datosPersonal = [];

  function cargarPersonal() {
    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "consultarPersonal", apiKey: API_KEY })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        datosPersonal = res.data;
        renderTabla(datosPersonal);
      } else {
        alert("Error al obtener datos: " + res.message);
      }
    })
    .catch(err => alert("Error de conexión al cargar la lista."));
  }

  function renderTabla(lista) {
    const tbody = document.querySelector("#tablaPersonal tbody");
    tbody.innerHTML = "";

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No se encontraron registros.</td></tr>';
      return;
    }

    lista.forEach(p => {
      tbody.innerHTML += `<tr>
        <td><b>${p.cedula}</b></td>
        <td>${p.nombre}</td>
        <td>${p.departamento}</td>
        <td>${p.cargo}</td>
      </tr>`;
    });
  }

  function filtrarTabla() {
    const q = document.getElementById("buscarInput").value.toLowerCase();
    const filtrados = datosPersonal.filter(p => 
      p.cedula.toLowerCase().includes(q) ||
      p.nombre.toLowerCase().includes(q) ||
      p.departamento.toLowerCase().includes(q) ||
      p.cargo.toLowerCase().includes(q)
    );
    renderTabla(filtrados);
  }
</script>

</body>
</html>
