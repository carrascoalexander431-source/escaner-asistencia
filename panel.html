<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - CUR May Hamilton</title>

  <!-- Librerías indispensables -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; color: #334155; }
    header { background: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; gap: 10px; background: #e2e8f0; padding: 10px 25px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: 600; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: white; }
    .container { max-width: 900px; margin: 25px auto; padding: 0 20px; }
    .tab-content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }
    input, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    button.btn-primary { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; }

    /* ESTILOS DE LA VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-box h3 { margin-bottom: 10px; color: #0f172a; }
    .modal-box p { font-size: 0.85rem; color: #64748b; margin-bottom: 15px; }
    #qrcodeContainer { display: flex; justify-content: center; margin: 15px 0; }
    .btn-close {
      background: #64748b; color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
    }
    .btn-close:hover { background: #475569; }
  </style>
</head>
<body>

<header>
  <h3>Control Institucional - May Hamilton</h3>
  <div>
    <span id="userDisplay" style="margin-right: 15px; font-size: 0.9rem;"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="cambiarTab('generador', event)">🪪 Generador de QR</button>
  <button class="tab-btn" onclick="cambiarTab('consulta', event)">🔍 Consulta de Personal</button>
</div>

<div class="container">

  <!-- MÓDULO 1: GENERADOR DE QR -->
  <div id="generador" class="tab-content active">
    <h2>Generador de QR Cifrado</h2>
    <hr style="margin: 15px 0;">
    <div class="form-group">
      <label for="cedula">Cédula / ID de Empleado:</label>
      <input type="text" id="cedula" placeholder="Ej: V-12345678" style="width:100%;">
    </div>
    <div class="form-group">
      <label for="secretKey">Clave Secreta Institucional (Opcional si usa la por defecto):</label>
      <input type="password" id="secretKey" placeholder="Ingresa la clave maestra" style="width:100%;">
    </div>
    <button class="btn-primary" onclick="generarQREmergente()">Generar Código QR</button>
  </div>

  <!-- MÓDULO 2: CONSULTA DE PERSONAL -->
  <div id="consulta" class="tab-content">
    <h2>Consulta de Personal Registrado</h2>
    <hr style="margin: 15px 0;">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="buscarInput" placeholder="Buscar por Nombre, Cédula o Cargo..." onkeyup="filtrarTabla()" style="flex:1;">
    </div>
    <button onclick="cargarPersonal()" style="background:#059669; color:white; border:none; cursor:pointer; font-weight:bold; margin-bottom: 15px; padding: 10px 15px; border-radius:6px;">🔄 Cargar / Actualizar Lista</button>

    <table id="tablaPersonal">
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre Completo</th>
          <th>Departamento</th>
          <th>Cargo</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" style="text-align:center;">Presione "Cargar / Actualizar Lista" para obtener la información.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- VENTANA EMERGENTE (MODAL QR) -->
<div id="qrModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Código QR Generado</h3>
    <p id="modalCedulaText">Cédula: -</p>
    
    <div id="qrcodeContainer"></div>

    <button class="btn-close" onclick="cerrarModal()">Cerrar Ventana</button>
  </div>
</div>
<script>
  const API_KEY = "MiClaveSuperSegura2026";
  const SECRET_KEY_DEF = "MiClaveSegura2026";
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

  // Control de sesión y navegación...
  if (!sessionStorage.getItem("session_token")) {
    window.location.href = "login.html";
  } else {
    const user = sessionStorage.getItem("session_user") || "Usuario";
    document.getElementById("userDisplay").innerText = "👤 " + user;
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

  function cambiarTab(tabId, evt) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
  }

  // =========================================================
  // AQUÍ COLOCAS LA FUNCIÓN CON DIAGNÓSTICO
  // =========================================================
  function generarQREmergente() {
    const cedulaInput = document.getElementById("cedula");
    const keyInput = document.getElementById("secretKey");
    const qrContainer = document.getElementById("qrcodeContainer");

    if (!cedulaInput || !cedulaInput.value.trim()) {
      alert("Por favor ingrese la cédula.");
      return;
    }

    const cedula = cedulaInput.value.trim();
    const key = keyInput && keyInput.value.trim() ? keyInput.value.trim() : SECRET_KEY_DEF;

    // Comprobación de la librería en el navegador
    if (typeof QRCode === "undefined") {
      alert("Error: La librería QRCode.js no se ha cargado. Verifica las etiquetas <script> en el <head>.");
      return;
    }

    qrContainer.innerHTML = "";

    try {
      // 1. Cifrar en AES
      const payload = JSON.stringify({ id: cedula, origen: "CUR_MAY_HAMILTON" });
      const cifrado = CryptoJS.AES.encrypt(payload, key).toString();

      // 2. Generar código QR
      new QRCode(qrContainer, {
        text: cifrado,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // 3. Abrir ventana emergente
      document.getElementById("modalCedulaText").innerText = "Cédula: " + cedula;
      document.getElementById("qrModal").style.display = "flex";

      // 4. Registro en la bitácora
      if (typeof registrarBitacoraQR === "function") {
        registrarBitacoraQR(cedula);
      }

    } catch (err) {
      alert("Error al generar el QR: " + err.message);
    }
  }

  function cerrarModal() {
    document.getElementById("qrModal").style.display = "none";
  }

  // ... (El resto de funciones como registrarBitacoraQR, cargarPersonal, etc.)
</script>
