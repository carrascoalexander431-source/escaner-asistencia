<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - CUR May Hamilton</title>

  <!-- Librerías JS para Cifrado y Generación de QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; color: #334155; }
    header { background: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; gap: 10px; background: #e2e8f0; padding: 10px 25px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: 600; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: white; }
    .container { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
    .tab-content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }
    input, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    button.btn-primary { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-search { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px 20px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
    .btn-search:hover { background: #1d4ed8; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; }

    /* ESTILOS DE LA VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-box h3 { margin-bottom: 5px; color: #0f172a; }
    .modal-box p { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; font-weight: bold; }
    #qrcodeContainer { display: flex; justify-content: center; margin: 15px 0; }
    .btn-close {
      background: #64748b; color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
    }
    .btn-close:hover { background: #475569; }
  </style>
</head>
<body>

<header>
  <h3>Control Institucional - May Hamilton</h3>
  <div>
    <span id="userDisplay" style="margin-right: 15px; font-size: 0.9rem;"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>

<div class="nav-tabs">
  <button id="btnTabGen" class="tab-btn active" onclick="cambiarTab('generador')">🪪 Generador de QR</button>
  <button id="btnTabCon" class="tab-btn" onclick="cambiarTab('consulta')">🔍 Historial de Asistencias</button>
</div>

<div class="container">

  <!-- MÓDULO 1: GENERADOR DE QR -->
  <div id="generador" class="tab-content active">
    <h2>Generador de QR Cifrado</h2>
    <hr style="margin: 15px 0;">
    
    <div class="form-group">
      <label for="cedula">Cédula / ID de Empleado:</label>
      <input type="text" id="cedula" placeholder="Ej: V-12345678" style="width:100%;">
    </div>

    <button class="btn-primary" onclick="generarQREmergente()">Generar Código QR</button>
  </div>

  <!-- MÓDULO 2: HISTORIAL DE ASISTENCIAS -->
  <div id="consulta" class="tab-content">
    <h2>Consulta de Registro de Asistencias</h2>
    <hr style="margin: 15px 0;">
    
    <div class="search-bar">
      <input type="text" id="buscarInput" placeholder="Ingresa Cédula (Ej: V-11992598) o Nombre..." onkeypress="if(event.key==='Enter') buscarAsistencias()" style="flex:1;">
      <button class="btn-search" onclick="buscarAsistencias()">🔍 Buscar</button>
      <button onclick="cargarAsistencias()" style="background:#059669; color:white; border:none; cursor:pointer; font-weight:bold; padding: 10px 15px; border-radius:6px;">🔄 Ver Todo</button>
    </div>

    <table id="tablaPersonal">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Cédula</th>
          <th>Nombre Completo</th>
          <th>Departamento</th>
          <th>Estatus</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="6" style="text-align:center;">Ingresa una cédula y presiona "🔍 Buscar" o haz clic en "Ver Todo".</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- VENTANA EMERGENTE (MODAL QR) -->
<div id="qrModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Código QR Generado</h3>
    <p id="modalCedulaText">Cédula: -</p>
    <div id="qrcodeContainer"></div>
    <button class="btn-close" onclick="cerrarModal()">Cerrar Ventana</button>
  </div>
</div>

<script>
  const API_KEY = "MiClaveSuperSegura2026";
  const SECRET_KEY_DEF = "MiClaveSegura2026";
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

  window.onload = function() {
    if (!sessionStorage.getItem("session_token")) {
      window.location.href = "login.html";
    } else {
      const user = sessionStorage.getItem("session_user") || "Usuario";
      document.getElementById("userDisplay").innerText = "👤 " + user;
    }
  };

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

  function cambiarTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (tabId === 'generador') document.getElementById('btnTabGen').classList.add('active');
    if (tabId === 'consulta') {
      document.getElementById('btnTabCon').classList.add('active');
      cargarAsistencias();
    }
  }

  function generarQREmergente() {
    const cedulaInput = document.getElementById("cedula");
    const qrContainer = document.getElementById("qrcodeContainer");

    if (!cedulaInput || !cedulaInput.value.trim()) {
      alert("Por favor ingrese la cédula o ID del empleado.");
      return;
    }

    const cedula = cedulaInput.value.trim();
    qrContainer.innerHTML = "";

    try {
      const payload = JSON.stringify({ id: cedula, origen: "CUR_MAY_HAMILTON" });
      const cifrado = CryptoJS.AES.encrypt(payload, SECRET_KEY_DEF).toString();

      new QRCode(qrContainer, {
        text: cifrado,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("modalCedulaText").innerText = "Cédula: " + cedula;
      document.getElementById("qrModal").style.display = "flex";

      if (typeof registrarBitacoraQR === "function") {
        registrarBitacoraQR(cedula);
      }
    } catch (err) {
      alert("Error al procesar el código QR: " + err.message);
    }
  }

  function cerrarModal() {
    document.getElementById("qrModal").style.display = "none";
  }

  function registrarBitacoraQR(cedulaGenerada) {
    const usuarioActual = sessionStorage.getItem("session_user") || "Desconocido";
    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "registrarGeneracionQR",
        usuario: usuarioActual,
        rol: "Administrador",
        cedulaGenerada: cedulaGenerada
      })
    }).catch(e => console.log("Bitácora:", e));
  }

  // CONSULTA DE ASISTENCIAS
  let datosAsistencias = [];

  function cargarAsistencias() {
    const tbody = document.querySelector("#tablaPersonal tbody");
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">⏳ Cargando registros...</td></tr>';

    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "consultarAsistencias", apiKey: API_KEY })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        datosAsistencias = res.data;
        buscarAsistencias();
      } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Error al obtener datos.</td></tr>';
      }
    })
    .catch(err => {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Error de conexión.</td></tr>';
    });
  }

  function buscarAsistencias() {
    const query = document.getElementById("buscarInput").value.trim().toLowerCase();
    
    if (!query) {
      renderTabla(datosAsistencias);
      return;
    }

    const filtrados = datosAsistencias.filter(a => 
      (a.cedula && a.cedula.toLowerCase().includes(query)) ||
      (a.nombre && a.nombre.toLowerCase().includes(query)) ||
      (a.fecha && a.fecha.toString().toLowerCase().includes(query))
    );

    renderTabla(filtrados);
  }

  function renderTabla(lista) {
    const tbody = document.querySelector("#tablaPersonal tbody");
    tbody.innerHTML = "";

    if (!lista || lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No se encontraron registros de ingreso para esta búsqueda.</td></tr>';
      return;
    }

    // Ordenar para mostrar las fechas/horas más recientes primero
    lista.slice().reverse().forEach(a => {
      tbody.innerHTML += `<tr>
        <td>${a.fecha}</td>
        <td><b>${a.hora}</b></td>
        <td><b>${a.cedula}</b></td>
        <td>${a.nombre}</td>
        <td>${a.departamento}</td>
        <td><span style="background:#dcfce7; color:#15803d; padding:3px 8px; border-radius:4px; font-weight:bold; font-size:0.8rem;">${a.estatus}</span></td>
      </tr>`;
    });
  }
</script>

</body>
</html>
