<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - CUR May Hamilton</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.4.15/dist/easy.qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; color: #334155; }
    header { background: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; gap: 10px; background: #e2e8f0; padding: 10px 25px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; cursor: pointer; font-weight: 600; border-radius: 6px; }
    .tab-btn.active { background: #2563eb; color: white; }
    .container { max-width: 900px; margin: 25px auto; padding: 0 20px; }
    .tab-content { display: none; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }
    input, select, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
    button.btn-primary { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; }
    button.btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>
<body>

<header>
  <h3>Control Institucional - May Hamilton</h3>
  <div>
    <span id="userDisplay" style="margin-right: 15px; font-size: 0.9rem;"></span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="cambiarTab('generador')">🪪 Generador de QR</button>
  <button class="tab-btn" onclick="cambiarTab('consulta')">🔍 Consulta de Personal</button>
</div>

<div class="container">

  <!-- MÓDULO 1: GENERADOR DE QR -->
  <div id="generador" class="tab-content active">
    <h2>Generador de QR Cifrado</h2>
    <hr style="margin: 15px 0;">
    <div class="form-group">
      <label>Cédula / ID de Empleado:</label>
      <input type="text" id="cedula" placeholder="Ej: V-12345678" style="width:100%;">
    </div>
    <div class="form-group">
      <label>Clave Secreta Institucional:</label>
      <input type="password" id="secretKey" placeholder="Ingresa la clave maestra" style="width:100%;">
    </div>
    <button class="btn-primary" onclick="generarQR()">Generar Código QR</button>
    <div id="qrcode"></div>
  </div>

  <!-- MÓDULO 2: CONSULTA DE PERSONAL -->
  <div id="consulta" class="tab-content">
    <h2>Consulta de Personal Registrado</h2>
    <hr style="margin: 15px 0;">
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <input type="text" id="buscarInput" placeholder="Buscar por Nombre, Cédula o Cargo..." onkeyup="filtrarTabla()" style="flex:1;">
    </div>

    <button onclick="cargarPersonal()" style="background:#059669; color:white; border:none; cursor:pointer; font-weight:bold; margin-bottom: 15px;">🔄 Cargar / Actualizar Lista</button>

    <table id="tablaPersonal">
      <thead>
        <tr>
          <th>Cédula</th>
          <th>Nombre Completo</th>
          <th>Departamento</th>
          <th>Cargo</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" style="text-align:center;">Presione "Cargar / Actualizar Lista" para obtener la información.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const API_KEY = "MiClaveSuperSegura2026";
  const SECRET_KEY_DEF = "MiClaveSegura2026"; // Clave por defecto de respaldo
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";
  const LOGO_URL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITO/main/logo.png"; // Reemplaza con tu ruta Raw de GitHub

  // Verificar sesión activa
  if (!sessionStorage.getItem("session_token")) {
    window.location.href = "login.html";
  } else {
    const user = sessionStorage.getItem("session_user") || "Usuario";
    document.getElementById("userDisplay").innerText = "👤 " + user;
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

  function cambiarTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // GENERADOR DE QR CORREGIDO
  function generarQR() {
    const cedula = document.getElementById("cedula").value.trim();
    let key = document.getElementById("secretKey").value.trim();
    const container = document.getElementById("qrcode");

    if (!cedula) {
      alert("Por favor ingrese la cédula o ID del empleado.");
      return;
    }

    // Si el usuario deja la clave en blanco, usa la clave maestra por defecto
    if (!key) {
      key = SECRET_KEY_DEF;
    }

    // Limpiar contenedor previo
    container.innerHTML = "";

    try {
      // 1. Preparar datos y cifrar en AES
      const payload = JSON.stringify({ id: cedula, origen: "CUR_MAY_HAMILTON" });
      const cifrado = CryptoJS.AES.encrypt(payload, key).toString();

      // 2. Generar el código QR
      new QRCode(container, {
        text: cifrado,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H,
        logo: LOGO_URL,
        logoWidth: 50,
        logoHeight: 50,
        logoBackgroundColor: '#ffffff',
        logoBackgroundTransparent: false
      });

      // 3. Registrar en la Bitácora de Google Sheets
      registrarBitacoraQR(cedula);

    } catch (err) {
      console.error("Error al generar QR:", err);
      alert("Error al generar el código QR. Verifique las librerías cargadas.");
    }
  }

  // Registrar auditoría de quién generó el QR
  function registrarBitacoraQR(cedulaGenerada) {
    const usuarioActual = sessionStorage.getItem("session_user") || "Desconocido";

    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "registrarGeneracionQR",
        usuario: usuarioActual,
        rol: "Administrador",
        cedulaGenerada: cedulaGenerada
      })
    }).catch(e => console.log("Error al guardar bitácora:", e));
  }

  // CONSULTA DE PERSONAL
  let datosPersonal = [];

  function cargarPersonal() {
    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "consultarPersonal", apiKey: API_KEY })
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        datosPersonal = res.data;
        renderTabla(datosPersonal);
      } else {
        alert("Error al obtener datos: " + res.message);
      }
    })
    .catch(err => alert("Error al conectar con la base de datos."));
  }

  function renderTabla(lista) {
    const tbody = document.querySelector("#tablaPersonal tbody");
    tbody.innerHTML = "";

    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No se encontraron registros.</td></tr>';
      return;
    }

    lista.forEach(p => {
      tbody.innerHTML += `<tr>
        <td><b>${p.cedula}</b></td>
        <td>${p.nombre}</td>
        <td>${p.departamento}</td>
        <td>${p.cargo}</td>
      </tr>`;
    });
  }

  function filtrarTabla() {
    const q = document.getElementById("buscarInput").value.toLowerCase();
    const filtrados = datosPersonal.filter(p => 
      p.cedula.toLowerCase().includes(q) ||
      p.nombre.toLowerCase().includes(q) ||
      p.departamento.toLowerCase().includes(q) ||
      p.cargo.toLowerCase().includes(q)
    );
    renderTabla(filtrados);
  }
</script>
