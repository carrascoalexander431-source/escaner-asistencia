<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - CUR May Hamilton</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
    .logo { max-width: 110px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
    h2 { color: #0f172a; margin-bottom: 5px; font-size: 1.3rem; }
    p.subtitle { color: #64748b; font-size: 0.82rem; margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 0.85rem; font-weight: 600; color: #475569; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; padding: 11px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    #msg { margin-top: 15px; font-size: 0.85rem; font-weight: 600; display: none; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

<div class="login-card">
  <!-- LOGO DE LA UNIVERSIDAD -->
  <img src="logo.png" alt="Logo CUR May Hamilton" class="logo" onerror="this.style.display='none'">
  
  <h2>Acceso Administrativo</h2>
  <p class="subtitle">Colegio Universitario de Rehabilitación "May Hamilton"</p>

  <div class="input-group">
    <label>Usuario:</label>
    <input type="text" id="userInput" placeholder="Ej: admin">
  </div>

  <div class="input-group">
    <label>Contraseña:</label>
    <input type="password" id="passInput" placeholder="••••••••" onkeypress="if(event.key==='Enter') iniciarSesion()">
  </div>

  <button onclick="iniciarSesion()">Ingresar al Sistema</button>
  <div id="msg"></div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

  function iniciarSesion() {
    const user = document.getElementById("userInput").value.trim();
    const pass = document.getElementById("passInput").value.trim();
    const msg = document.getElementById("msg");

    if (!user || !pass) {
      msg.className = "error";
      msg.style.display = "block";
      msg.innerText = "Por favor ingresa usuario y contraseña.";
      return;
    }

    msg.style.display = "block";
    msg.className = "";
    msg.innerText = "Validando credenciales...";

    fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "login", username: user, password: pass })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        sessionStorage.setItem("session_token", data.token);
        sessionStorage.setItem("session_user", data.user);
        window.location.href = "panel.html";
      } else {
        msg.className = "error";
        msg.innerText = "❌ " + data.message;
      }
    })
    .catch(err => {
      msg.className = "error";
      msg.innerText = "❌ Error de conexión al verificar credenciales.";
    });
  }
</script>

</body>
</html>
