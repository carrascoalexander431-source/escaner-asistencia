<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia - Escáner QR</title>
  
  <!-- Estilos CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h2 {
      color: #1a252f;
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    p.subtitle {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      min-height: 250px;
    }

    #reader button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    #reader button:hover {
      background-color: #1d4ed8;
    }

    #result-box {
      margin-top: 20px;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
      word-break: break-word;
    }

    .status-info {
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .status-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
  </style>

  <!-- Librería Html5QrcodeScanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Librería CryptoJS para descifrado AES-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Control de Asistencia</h2>
    <p class="subtitle">Escanee el código QR de su carnet institucional</p>

    <!-- Contenedor del escáner -->
    <div id="reader"></div>

    <!-- Caja de respuestas -->
    <div id="result-box"></div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE PARÁMETROS DEL SISTEMA
    // ==========================================
    const SECRET_KEY = "MiClaveSegura2026"; // Clave del QR cifrado
    const API_KEY = "MiClaveSuperSegura2026";    // Clave para Google Apps Script
    
    // ⚠️ REEMPLAZA ESTA URL CON LA TUYA DE GOOGLE APPS SCRIPT:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec"; 

    let html5QrcodeScanner = null;

    // Función para mostrar alertas en pantalla
    function mostrarResultado(tipo, mensaje) {
      const resultBox = document.getElementById("result-box");
      resultBox.className = "";
      resultBox.style.display = "block";

      if (tipo === "info") resultBox.classList.add("status-info");
      if (tipo === "success") resultBox.classList.add("status-success");
      if (tipo === "error") resultBox.classList.add("status-error");

      resultBox.innerText = mensaje;
    }

    // Procesar la lectura exitosa del QR
    function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error("Error al detener escáner:", err));
      }

      mostrarResultado("info", "🔑 Descifrando código QR...");

      try {
        // Descifrar con CryptoJS AES-256
        const bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY);
        const decryptedDataText = bytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedDataText) {
          throw new Error("Clave o formato incorrecto.");
        }

        const dataObj = JSON.parse(decryptedDataText);

        // Acepta tanto 'id' (de tu generador) como 'cedula'
        const cedulaExtraida = dataObj.id || dataObj.cedula;

        if (dataObj.origen !== "CUR_MAY_HAMILTON" || !cedulaExtraida) {
          throw new Error("Código QR no autorizado.");
        }

        procesarMarcaje(cedulaExtraida);

      } catch (error) {
        mostrarResultado("error", "❌ Error: Código QR inválido o no reconocido.");
        setTimeout(() => { iniciarEscaner(); }, 4000);
      }
    }

    // Enviar marcaje hacia Apps Script
    function procesarMarcaje(cedulaEmpleado) {
      mostrarResultado("info", "⏳ Registrando asistencia en la base de datos...");

      const payload = {
        apiKey: API_KEY,
        cedula: cedulaEmpleado,
        timestamp: new Date().toISOString()
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        mostrarResultado("success", `✅ Registro enviado para C.I. ${cedulaEmpleado}`);
        setTimeout(() => { iniciarEscaner(); }, 4000);
      })
      .catch(err => {
        mostrarResultado("error", "❌ Error de conexión al registrar la asistencia.");
        setTimeout(() => { iniciarEscaner(); }, 4000);
      });
    }

    function onScanFailure(error) {
      // Ignorar lectura continua en blanco
    }

    // Iniciar escáner de cámara
    function iniciarEscaner() {
      const resultBox = document.getElementById("result-box");
      resultBox.style.display = "none";

      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(() => {});
      }

      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        /* verbose= */ false
      );

      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    // Arrancar la cámara automáticamente al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      iniciarEscaner();
    });
  </script>
</body>
</html>
