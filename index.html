<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Asistencia - Registro</title>
  
  <!-- Librería para lectura de cámara y QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Librería para descifrado AES-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; max-width: 450px; margin-left: auto; margin-right: auto; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h2>Escáner de Asistencia Institucional</h2>
  
  <!-- Contenedor del video de la cámara -->
  <div id="reader"></div>

  <!-- Estado o mensaje de resultado -->
  <div id="statusMessage" class="status" style="display:none;"></div>

<script>
  // Clave secreta fija (Debe ser LA MISMA usada en el generador de QR)
  const SECRET_KEY = "MiClaveSegura2026";

  // Función que se ejecuta cuando la cámara detecta un QR
  function onScanSuccess(decodedText, decodedResult) {
    // Pausar o detener temporalmente el escáner para evitar lecturas dobles
    html5QrcodeScanner.clear();

    try {
      // 1. Intentar descifrar el contenido del QR con AES-256
      const bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY);
      const textoDescifrado = bytes.toString(CryptoJS.enc.Utf8);

      if (!textoDescifrado) {
        throw new Error("Clave inválida o QR alterado");
      }

      // 2. Convertir la cadena descifrada a un objeto JSON
      const datosEmpleado = JSON.parse(textoDescifrado);

      // 3. Validar origen / sello institucional
      if (datosEmpleado.origen !== "CUR_MAY_HAMILTON") {
        throw new Error("Código QR no pertenece a la institución");
      }

      // ¡Lectura exitosa y verificada!
      mostrarResultado("success", `✅ Empleado Validado: ID ${datosEmpleado.id}`);
      
      // Aquí enviarás los datos al backend (Siguiente paso: Apps Script / API)
      procesarMarcaje(datosEmpleado.id);

    } catch (err) {
      mostrarResultado("error", "❌ Código QR FALSO o Inválido. Acceso denegado.");
      
      // Reactivar la cámara después de 3 segundos
      setTimeout(() => {
        iniciarEscaner();
      }, 3000);
    }
  }

  function mostrarResultado(tipo, mensaje) {
    const el = document.getElementById("statusMessage");
    el.className = `status ${tipo}`;
    el.innerText = mensaje;
    el.style.display = "block";
  }

  function procesarMarcaje(cedulaEmpleado) {
    console.log("Enviando registro de:", cedulaEmpleado);
    // Aquí conectaremos la función con Google Apps Script más adelante
  }

  function iniciarEscaner() {
    document.getElementById("statusMessage").style.display = "none";
    html5QrcodeScanner.render(onScanSuccess, (error) => {
      // Errores menores de enfoque/cuadro se ignoran silenciosamente
    });
  }

  // Inicializar el escáner al cargar la página
  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", 
    { fps: 10, qrbox: { width: 250, height: 250 } },
    /* verbose= */ false
  );

  iniciarEscaner();
</script>

</body>
</html>
