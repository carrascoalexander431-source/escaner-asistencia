<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia - Escáner QR</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h2 {
      color: #1a252f;
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    p.subtitle {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      min-height: 250px;
    }

    #reader button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    #result-box {
      margin-top: 20px;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
      word-break: break-word;
    }

    .status-info { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .status-success { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .status-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>

  <!-- Librerías -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Control de Asistencia</h2>
    <p class="subtitle">Escanee el código QR de su carnet institucional</p>

    <div id="reader"></div>
    <div id="result-box"></div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE PARÁMETROS DEL SISTEMA
    // ==========================================
    const SECRET_KEY = "MiClaveSegura2026"; 
    const API_KEY = "MiClaveSuperSegura2026";    
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

    let html5QrcodeScanner = null;

    function mostrarResultado(tipo, mensaje) {
      const resultBox = document.getElementById("result-box");
      resultBox.className = "";
      resultBox.style.display = "block";

      if (tipo === "info") resultBox.classList.add("status-info");
      if (tipo === "success") resultBox.classList.add("status-success");
      if (tipo === "error") resultBox.classList.add("status-error");

      resultBox.innerText = mensaje;
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error(err));
      }

      mostrarResultado("info", "🔑 Decodificando código QR...");

      try {
        const qrTextoLimpio = decodedText.trim();
        let decryptedDataText = "";

        // Intentar desencriptar atrapando errores de codificación UTF-8
        try {
          const bytes = CryptoJS.AES.decrypt(qrTextoLimpio, SECRET_KEY);
          decryptedDataText = bytes.toString(CryptoJS.enc.Utf8);
        } catch (e) {
          throw new Error("El código QR no es válido o fue generado con otra clave secreta.");
        }

        if (!decryptedDataText) {
          throw new Error("El código QR no es válido o fue generado con otra clave secreta.");
        }

        const dataObj = JSON.parse(decryptedDataText);
        const cedulaExtraida = dataObj.id || dataObj.cedula;

        if (dataObj.origen !== "CUR_MAY_HAMILTON" || !cedulaExtraida) {
          throw new Error("El código QR no pertenece a esta institución.");
        }

        procesarMarcaje(cedulaExtraida);

      } catch (error) {
        mostrarResultado("error", "❌ " + error.message);
        setTimeout(() => { iniciarEscaner(); }, 4000);
      }
    }

    function procesarMarcaje(cedulaEmpleado) {
      mostrarResultado("info", "⏳ Verificando cédula en la base de datos...");

      const payload = {
        apiKey: API_KEY,
        cedula: cedulaEmpleado,
        timestamp: new Date().toISOString()
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          mostrarResultado("success", `✅ ¡Asistencia registrada para C.I. ${cedulaEmpleado}!`);
          setTimeout(() => { iniciarEscaner(); }, 4000);
        } else if (data.status === "not_found") {
          mostrarResultado("error", `❌ La C.I. ${cedulaEmpleado} no existe en la base de datos. Acuda a RRHH.`);
          setTimeout(() => { iniciarEscaner(); }, 5000);
        } else {
          mostrarResultado("error", `❌ Error: ${data.message}`);
          setTimeout(() => { iniciarEscaner(); }, 4000);
        }
      })
      .catch(err => {
        mostrarResultado("error", "❌ Error de conexión al servidor.");
        setTimeout(() => { iniciarEscaner(); }, 4000);
      });
    }

    function onScanFailure(error) {
      // Búsqueda continua
    }

    function iniciarEscaner() {
      const resultBox = document.getElementById("result-box");
      resultBox.style.display = "none";

      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
          fps: 10, 
          qrbox: { width: 250, height: 250 } 
        }, 
        false
      );

      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    document.addEventListener("DOMContentLoaded", () => {
      iniciarEscaner();
    });
  </script>
</body>
</html>
