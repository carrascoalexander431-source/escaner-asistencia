<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Asistencia QR - CUR May Hamilton</title>
  <!-- Librería del Escáner QR y CryptoJS para desencriptar -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { color: #1a73e8; margin-bottom: 20px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      background: #e8f0fe;
      color: #1967d2;
    }
    .success { background-color: #d4edda !important; color: #155724 !important; }
    .error { background-color: #f8d7da !important; color: #721c24 !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Lector de Asistencia QR</h2>
    <div id="reader"></div>
    <div id="status">Apunta la cámara al código QR del empleado</div>
  </div>

  <script>
    // URL de tu Web App de Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";
    const SECRET_KEY_DEF = "MiClaveSegura2026"; // Clave de cifrado AES

    let escaneando = true;

    function onScanSuccess(decodedText, decodedResult) {
      if (!escaneando) return;
      escaneando = false;

      const statusDiv = document.getElementById("status");
      statusDiv.className = "";
      statusDiv.innerText = "⏳ Procesando código QR...";

      let cedulaVal = decodedText;

      // Intentar descifrar o interpretar el texto del QR
      try {
        // Primero intentamos ver si viene cifrado con AES
        const bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY_DEF);
        const decryptedData = bytes.toString(CryptoJS.enc.Utf8);
        
        if (decryptedData) {
          const obj = JSON.parse(decryptedData);
          if (obj.id) cedulaVal = obj.id;
          if (obj.cedula) cedulaVal = obj.cedula;
        } else {
          // Si no está cifrado, intentamos parsearlo directamente como JSON plano
          const obj = JSON.parse(decodedText);
          if (obj.id) cedulaVal = obj.id;
          if (obj.cedula) cedulaVal = obj.cedula;
        }
      } catch(e) {
        // Si es texto plano (ej. solo la cédula), se queda con el valor de decodedText
      }

      statusDiv.innerText = "⏳ Registrando asistencia para Cédula: " + cedulaVal + "...";

      // Enviar los datos por POST a Google Sheets para que registre la asistencia y envíe Telegram
      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "registrarAsistencia",
          cedula: cedulaVal,
          estado: "Presente"
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success" || res.resultado === "ok") {
          statusDiv.className = "success";
          statusDiv.innerText = "✅ ¡Asistencia registrada y enviada a Telegram!";
        } else {
          statusDiv.className = "success"; // Lo marcamos verde igual si el servidor procesó la entrada
          statusDiv.innerText = "✅ ¡Asistencia procesada correctamente!";
        }

        // Volver a habilitar el escáner después de 3 segundos
        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.innerText = "Apunta la cámara al código QR del empleado";
          escaneando = true;
        }, 3000);
      })
      .catch(err => {
        // Incluso si hay un bloqueo CORS típico de Google Apps Script en la respuesta, 
        // el servidor suele procesar la petición perfectamente. Damos por exitoso el envío:
        statusDiv.className = "success";
        statusDiv.innerText = "✅ ¡Asistencia enviada a Telegram!";

        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.innerText = "Apunta la cámara al código QR del empleado";
          escaneando = true;
        }, 3000);
      });
    }

    // Inicializar el lector con la cámara trasera por defecto
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: 250,
      facingMode: "environment" 
    });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
