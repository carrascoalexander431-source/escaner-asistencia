<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - CUR May Hamilton</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #334155; }
    .login-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    .login-card h2 { margin-bottom: 8px; color: #1e293b; font-size: 1.5rem; }
    .login-card p { font-size: 0.85rem; color: #64748b; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #475569; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #2563eb; }
    button.btn-login { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button.btn-login:hover { background: #1d4ed8; }
    #errorMsg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; font-weight: 600; display: none; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Control Institucional</h2>
  <p>Colegio Universitario de Rehabilitación "May Hamilton"</p>
  
  <div class="form-group">
    <label for="username">Usuario Administrador:</label>
    <input type="text" id="username" placeholder="Ingrese su usuario">
  </div>

  <div class="form-group">
    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Ingrese su contraseña">
  </div>

  <button class="btn-login" onclick="intentarLogin()">Iniciar Sesión</button>
  <div id="errorMsg">Usuario o contraseña incorrectos.</div>
</div>

<script>
  // Credenciales institucionales de acceso
  const ADMIN_USER = "admin"; 
  const ADMIN_PASS = "MayHamilton2026";

  // Si ya hay una sesión activa, redirige directamente al panel
  window.onload = function() {
    if (sessionStorage.getItem("session_token")) {
      window.location.href = "panel.html";
    }
  };

  function intentarLogin() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const errorDiv = document.getElementById("errorMsg");

    if (user === ADMIN_USER && pass === ADMIN_PASS) {
      errorDiv.style.display = "none";
      sessionStorage.setItem("session_token", "token_activo_987654");
      sessionStorage.setItem("session_user", user);
      
      // Redirige al panel de control protegido
      window.location.href = "panel.html";
    } else {
      errorDiv.style.display = "block";
    }
  }

  // Permitir iniciar sesión presionando la tecla Enter en la contraseña
  document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      intentarLogin();
    }
  });
</script>

</body>
</html>
