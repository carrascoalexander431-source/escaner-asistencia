<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { color: #1a73e8; margin-bottom: 20px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; min-height: 250px; background: #eee; }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      background: #e8f0fe;
      color: #1967d2;
    }
    .btn-start {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 15px;
      width: 100%;
    }
    .success { background-color: #d4edda !important; color: #155724 !important; }
    iframe { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Lector de Asistencia QR</h2>
    <button id="startBtn" class="btn-start" onclick="iniciarCamara()">Activar Cámara</button>
    <div id="reader"></div>
    <div id="status">Haz clic en "Activar Cámara" para comenzar</div>
  </div>

  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>
  <form id="qrForm" method="GET" target="hidden_iframe">
    <input type="hidden" name="cedula" id="form_cedula">
    <input type="hidden" name="nombre" id="form_nombre">
    <input type="hidden" name="departamento" id="form_departamento">
    <input type="hidden" name="cargo" id="form_cargo">
    <input type="hidden" name="estado" value="Presente">
  </form>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec";

    let escaneando = true;
    let html5QrCode;

    function iniciarCamara() {
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("status").innerText = "Solicitando acceso a la cámara...";

      html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        document.getElementById("status").innerText = "❌ Error al acceder a la cámara. Revisa los permisos.";
        document.getElementById("startBtn").style.display = "block";
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (!escaneando) return;
      escaneando = false;

      const statusDiv = document.getElementById("status");
      statusDiv.className = "";
      statusDiv.innerText = "⏳ Registrando asistencia para: " + decodedText + "...";

      let cedulaVal = decodedText;
      let nombreVal = "Empleado (" + decodedText + ")";
      let dptoVal = "Oficina / Personal";
      let cargoVal = "No Especificado";

      try {
        const obj = JSON.parse(decodedText);
        if (obj.cedula) cedulaVal = obj.cedula;
        if (obj.nombre) nombreVal = obj.nombre;
        if (obj.departamento) dptoVal = obj.departamento;
        if (obj.cargo) cargoVal = obj.cargo;
      } catch(e) {
        // Texto plano
      }

      const form = document.getElementById("qrForm");
      form.action = WEB_APP_URL;
      document.getElementById("form_cedula").value = cedulaVal;
      document.getElementById("form_nombre").value = nombreVal;
      document.getElementById("form_departamento").value = dptoVal;
      document.getElementById("form_cargo").value = cargoVal;

      form.submit();

      setTimeout(() => {
        statusDiv.className = "success";
        statusDiv.innerText = "✅ ¡Asistencia registrada!";
        
        setTimeout(() => {
          statusDiv.className = "";
          statusDiv.innerText = "Apunta al código QR";
          escaneando = true;
        }, 3000);
      }, 500);
    }
  </script>
</body>
</html>
