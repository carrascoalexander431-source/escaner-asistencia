<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia - Escáner QR</title>
  
  <!-- Estilos CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h2 {
      color: #1a252f;
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    p.subtitle {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
    }

    /* Ocultar botones predeterminados poco estéticos de la librería */
    #reader button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    #reader button:hover {
      background-color: #1d4ed8;
    }

    #result-box {
      margin-top: 20px;
      padding: 12px 15px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
      word-break: break-word;
    }

    .status-info {
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .status-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
  </style>

  <!-- Librería Html5QrcodeScanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Librería CryptoJS para descifrado AES-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Control de Asistencia</h2>
    <p class="subtitle">Escanee el código QR de su carnet institucional</p>

    <!-- Contenedor donde se dibuja el escáner de la cámara -->
    <div id="reader"></div>

    <!-- Caja de mensajes y alertas -->
    <div id="result-box"></div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE PARÁMETROS DEL SISTEMA
    // ==========================================
    const SECRET_KEY = "MiClaveSegura2026"; // Clave AES-256 compartida con el generador QR
    const API_KEY = "MiClaveSuperSegura2026";    // Clave compartida con Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoWPJjsXXrRIdzsscoMZtYQ7_0s0nyJ7emLnRG1cnpq-gTl8au6LUNF-seUTpOfyxEGA/exec"; // Reemplaza con la URL desplegada de Apps Script

    let html5QrcodeScanner = null;

    // Mostrar mensajes dinámicos de estado en pantalla
    function mostrarResultado(tipo, mensaje) {
      const resultBox = document.getElementById("result-box");
      resultBox.className = "";
      resultBox.style.display = "block";

      if (tipo === "info") resultBox.classList.add("status-info");
      if (tipo === "success") resultBox.classList.add("status-success");
      if (tipo === "error") resultBox.classList.add("status-error");

      resultBox.innerText = mensaje;
    }

    // Procesar lectura del código QR
    function onScanSuccess(decodedText, decodedResult) {
      // Detener el escáner mientras procesamos la petición
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error("Error al pausar escáner:", err));
      }

      mostrarResultado("info", "🔑 Descifrando código QR...");

      try {
        // Descifrado con AES-256
        const bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY);
        const decryptedDataText = bytes.toString(CryptoJS.enc.Utf8);

        if (!decryptedDataText) {
          throw new Error("Clave inválida o formato incorrecto.");
        }

        const dataObj = JSON.parse(decryptedDataText);

        // Validación de cabecera/origen del QR
        if (dataObj.origen !== "CUR_MAY_HAMILTON" || !dataObj.cedula) {
          throw new Error("Código QR no autorizado o corrupto.");
        }

        // Si el QR es válido, enviamos la cédula al backend
        procesarMarcaje(dataObj.cedula);

      } catch (error) {
        mostrarResultado("error", "❌ Error: Código QR inválido o no reconocido.");
        setTimeout(() => { iniciarEscaner(); }, 4000);
      }
    }

    // Envío de datos hacia Google Apps Script (Backend)
    function procesarMarcaje(cedulaEmpleado) {
      mostrarResultado("info", "⏳ Verificando credenciales en la base de datos...");

      const payload = {
        apiKey: API_KEY,
        cedula: cedulaEmpleado,
        timestamp: new Date().toISOString()
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", // Evita bloqueos de origen cruzado (CORS) desde GitHub Pages
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Al enviar con no-cors, la petición se completa y Apps Script procesa la validación/Telegram
        mostrarResultado("success", `✅ Solicitud procesada para la C.I. ${cedulaEmpleado}`);
        setTimeout(() => { iniciarEscaner(); }, 4000);
      })
      .catch(err => {
        mostrarResultado("error", "❌ Error de conexión con el servidor.");
        setTimeout(() => { iniciarEscaner(); }, 4000);
      });
    }

    // Inicializar el escáner de forma compatible con cualquier dispositivo
function iniciarEscaner() {
  const resultBox = document.getElementById("result-box");
  resultBox.style.display = "none";

  // Si ya había una instancia activa, nos aseguramos de limpiarla
  if (html5QrcodeScanner) {
    html5QrcodeScanner.clear().catch(() => {});
  }

  html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      config: {
        facingMode: "environment" // Pide la cámara trasera preferente, pero sin exigir "exact"
      }
    },
    /* verbose= */ false
  );

  html5QrcodeScanner.render(onScanSuccess, onScanFailure);
}
