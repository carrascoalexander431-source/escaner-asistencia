<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Asistencia - Registro</title>
  
  <!-- Librería para lectura de cámara y QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Librería para descifrado AES-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; max-width: 450px; margin-left: auto; margin-right: auto; word-break: break-word; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }
  </style>
</head>
<body>

  <h2>Escáner de Asistencia Institucional</h2>
  
  <!-- Contenedor del video de la cámara -->
  <div id="reader"></div>

  <!-- Estado o mensaje de resultado -->
  <div id="statusMessage" class="status" style="display:none;"></div>

<script>
  // 1. Claves de seguridad
  const SECRET_KEY = "MiClaveSegura2026";      // Para desencriptar el QR
  const API_KEY = "MiClaveSuperSegura2026";    // Para autenticar la petición hacia Google Apps Script

  // 2. URL de tu Web App en Google Apps Script
  const WEB_APP_URL = "https://script.google.com/macros/s/REEMPLAZA_CON_TU_SCRIPT_ID/exec"; 

  // Función principal cuando la cámara lee un QR
  async function onScanSuccess(decodedText, decodedResult) {
    html5QrcodeScanner.clear();

    try {
      // A. Validar y desencriptar el QR con AES-256
      const bytes = CryptoJS.AES.decrypt(decodedText, SECRET_KEY);
      const textoDescifrado = bytes.toString(CryptoJS.enc.Utf8);

      if (!textoDescifrado) {
        throw new Error("Código QR no cifrado o clave inválida.");
      }

      const datosEmpleado = JSON.parse(textoDescifrado);

      if (datosEmpleado.origen !== "CUR_MAY_HAMILTON") {
        throw new Error("El QR no pertenece a la institución.");
      }

      // B. Procesar y enviar la asistencia al servidor
      procesarMarcaje(datosEmpleado.id, { lat: 0, lng: 0 });

    } catch (err) {
      mostrarResultado("error", `❌ ${err.message || err}`);
      
      setTimeout(() => {
        iniciarEscaner();
      }, 4000);
    }
  }

  function mostrarResultado(tipo, mensaje) {
    const el = document.getElementById("statusMessage");
    el.className = `status ${tipo}`;
    el.innerText = mensaje;
    el.style.display = "block";
  }

  function procesarMarcaje(cedulaEmpleado, ubicacion) {
    mostrarResultado("info", "⏳ Registrando asistencia en el sistema...");

    const payload = {
      apiKey: API_KEY,
      cedula: cedulaEmpleado,
      latitud: ubicacion ? ubicacion.lat : 0,
      longitud: ubicacion ? ubicacion.lng : 0,
      timestamp: new Date().toISOString()
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      mostrarResultado("success", `✅ ¡Asistencia registrada para C.I. ${cedulaEmpleado}!`);
      
      setTimeout(() => {
        iniciarEscaner();
      }, 3500);
    })
    .catch(err => {
      mostrarResultado("error", "❌ Error de conexión al registrar la asistencia.");
      setTimeout(() => {
        iniciarEscaner();
      }, 4000);
    });
  }

  function iniciarEscaner() {
    document.getElementById("statusMessage").style.display = "none";
    html5QrcodeScanner.render(onScanSuccess, (error) => {});
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", 
    { fps: 10, qrbox: { width: 250, height: 250 } },
    false
  );

  iniciarEscaner();
</script>

</body>
</html>
